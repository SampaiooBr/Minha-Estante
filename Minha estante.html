<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Estante</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        :root {
            --bg-color: #120e0a;
            --card-bg: #1c1510;
            --card-hover: #261d16;
            --text-color: #f3e9dc;
            --text-muted: #b5a48f;
            --primary: #c27803;
            --primary-hover: #e08b04;
            --accent: #f59e0b;
            --danger: #991b1b;
            --border: #3d2c1d;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 20%, #291c12 0%, #120e0a 80%);
            color: var(--text-color);
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 30px; }

        h1 {
            color: var(--text-color);
            font-size: 2.4rem;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        header p { color: var(--text-muted); font-size: 1.05rem; font-style: italic; }

        .panel {
            background-color: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .controls-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        select, .btn {
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        select { background: #18110c; color: var(--text-color); min-width: 180px; cursor: pointer; }
        select:focus, .btn:focus { outline: none; border-color: var(--accent); }

        .btn { cursor: pointer; }
        .btn-primary { background-color: var(--primary); color: #fff; border-color: #d97706; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-sync { background-color: #374151; color: white; border-color: #4b5563; }
        .btn-sync:hover { background-color: #4b5563; }

        .sync-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            border-top: 1px solid var(--border);
            padding-top: 15px;
            flex-wrap: wrap;
        }

        input[type="file"] { display: none; }

        .tabs-container {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--border);
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 8px 8px 0 0;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--card-hover);
            color: var(--accent);
            border-color: var(--accent);
            border-bottom: 2px solid var(--bg-color);
            margin-bottom: -2px;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 25px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 6px 16px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .item-card:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: var(--accent);
        }

        .image-container {
            width: 100%;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            border: 2px solid #2b2118;
        }

        /* REGRAS DE PROPORÇÃO PADRONIZADAS POR MODELO DE MÍDIA */
        .ratio-PS5     { aspect-ratio: 1 / 1.38; }
        .ratio-PS4     { aspect-ratio: 1 / 1.38; }
        .ratio-PS2     { aspect-ratio: 1 / 1.41; }
        .ratio-Blu-ray { aspect-ratio: 1 / 1.50; }
        .ratio-DVD     { aspect-ratio: 1 / 1.41; }

        .item-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-info h3 {
            font-size: 0.95rem;
            margin: 8px 0 2px 0;
            color: var(--text-color);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.6em;
            font-weight: 700;
        }

        .item-year { font-size: 0.75rem; color: var(--accent); margin-bottom: 4px; font-weight: 600; }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }

        .badge-PS5 { background: #02367d; color: #fff; }
        .badge-PS4 { background: #00266b; color: #fff; }
        .badge-PS2 { background: #111111; color: #38bdf8; border: 1px solid #38bdf8; }
        .badge-Blu-ray { background: #1e1b4b; color: #60a5fa; border: 1px solid #60a5fa; }
        .badge-DVD { background: #7f1d1d; color: #fca5a5; }

        .barcode-text { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 12px; font-family: monospace; }

        .card-actions { display: flex; gap: 8px; margin-top: auto; }
        .card-actions button {
            flex: 1; padding: 8px; font-size: 0.8rem; border-radius: 6px;
            border: 1px solid var(--border); cursor: pointer; font-weight: 600;
        }

        .btn-edit { background: #261d16; color: var(--text-color); }
        .btn-delete { background: rgba(153, 27, 27, 0.2); color: #fca5a5; border-color: rgba(153, 27, 27, 0.4); }

        .empty-state {
            grid-column: 1 / -1; text-align: center; padding: 50px;
            color: var(--text-muted); font-size: 1.1rem; background: var(--card-bg);
            border: 2px dashed var(--border); border-radius: 12px; font-style: italic;
        }

        /* Modal de Detalhes */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
            z-index: 1000; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: var(--card-bg); border: 2px solid var(--accent); border-radius: 14px;
            max-width: 550px; width: 100%; padding: 30px; position: relative; max-height: 90vh; overflow-y: auto;
        }
        .modal-close {
            position: absolute; top: 15px; right: 20px; background: none; border: none;
            color: var(--text-muted); font-size: 1.5rem; cursor: pointer;
        }
        .modal-body { display: flex; gap: 20px; flex-wrap: wrap; }
        .modal-img-wrapper { display: flex; flex-direction: column; gap: 10px; width: 160px; }
        .modal-img { width: 100%; height: 230px; border-radius: 8px; border: 2px solid var(--border); object-fit: cover; background: #000; }
        .modal-info { flex: 1; min-width: 240px; }
        .modal-info h2 { margin-top: 0; color: var(--text-color); font-size: 1.4rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏛️ Minha Estante</h1>
        <p>Preservando a era de ouro das mídias físicas em grande estilo</p>
    </header>
    
    <div class="panel">
        <div class="controls-row">
            <select id="categorySelect">
                <option value="PS5">🎮 Jogos - PS5</option>
                <option value="PS4">🎮 Jogos - PS4</option>
                <option value="PS2">🎮 Jogos - PS2</option>
                <option value="Blu-ray">💿 Filmes - Blu-ray</option>
                <option value="DVD">💿 Filmes - DVD</option>
            </select>
            
            <label class="btn btn-primary">
                📸 Escanear Código
                <input type="file" accept="image/*" capture="environment" id="barcodeImageInput" onchange="processImage(this)">
            </label>
        </div>

        <div class="sync-container">
            <button class="btn btn-sync" onclick="exportData()">💾 Exportar Backup</button>
            <label class="btn btn-sync" style="cursor: pointer;">
                📂 Importar Local
                <input type="file" accept=".json" onchange="importData(this)">
            </label>
            <button class="btn btn-sync" onclick="openBatchModal()" style="background-color: #7c3aed;">⚡ Importação em Massa</button>
            <button class="btn btn-sync" onclick="updateAllItemsSmart()" style="background-color: #047857;">🔄 Atualizar Todos os Itens</button>
            <button class="btn btn-sync" onclick="openApoioModal()" style="background-color: #db2777; color: white;">💖 Apoio / PIX</button>
        </div>
    </div>

    <div class="tabs-container" id="tabsContainer">
        <button class="tab-btn active" onclick="filterTab('ALL', this)">Todos (<span id="count-ALL">0</span>)</button>
        <button class="tab-btn" onclick="filterTab('PS5', this)">PS5 (<span id="count-PS5">0</span>)</button>
        <button class="tab-btn" onclick="filterTab('PS4', this)">PS4 (<span id="count-PS4">0</span>)</button>
        <button class="tab-btn" onclick="filterTab('PS2', this)">PS2 (<span id="count-PS2">0</span>)</button>
        <button class="tab-btn" onclick="filterTab('Blu-ray', this)">Blu-ray (<span id="count-Blu-ray">0</span>)</button>
        <button class="tab-btn" onclick="filterTab('DVD', this)">DVD (<span id="count-DVD">0</span>)</button>
    </div>

    <div class="catalog-grid" id="catalogGrid"></div>
</div>

<!-- Modal de Detalhes do Item -->
<div class="modal-overlay" id="itemModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModalDirect()">×</button>
        <div class="modal-body" id="modalBodyContent"></div>
    </div>
</div>

<!-- Modal de Importação em Massa -->
<div class="modal-overlay" id="batchModal" onclick="closeBatchModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="document.getElementById('batchModal').style.display='none'">×</button>
        <h2 style="color: var(--accent); margin-top:0;">⚡ Importar Vários Títulos</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Cole abaixo sua lista (um por linha). Ex: <code>PS4 | The Order 1886</code></p>
        <textarea id="batchTextarea" rows="8" style="width: 100%; background: #18110c; color: var(--text-color); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: monospace; font-size: 0.9rem;" placeholder="God of War Ragnarok&#10;Blu-ray | Matrix"></textarea>
        <div style="margin-top: 15px; display: flex; justify-content: flex-end; gap: 10px;">
            <button class="btn btn-sync" onclick="document.getElementById('batchModal').style.display='none'">Cancelar</button>
            <button class="btn btn-primary" onclick="processBatchImport()">🚀 Adicionar</button>
        </div>
    </div>
</div>

<script>
    let catalog = JSON.parse(localStorage.getItem('media_catalog')) || [];
    let currentTab = 'ALL';

    const dbInfo = {
        "god of war": { year: "2018", synopsis: "Saindo da sombra dos deuses, Kratos agora vive como um mortal no reino dos deuses e monstros nórdicos, buscando proteger seu filho." },
        "god of war remasterizado": { year: "2018", synopsis: "Saindo da sombra dos deuses, Kratos agora vive como um mortal no reino dos deuses e monstros nórdicos, buscando proteger seu filho." },
        "god of war 3": { year: "2015", synopsis: "Kratos descansa nas profundezas do Monte Olimpo para buscar vingança implacável contra os Deuses que o traíram." },
        "red dead redemption": { year: "2018", synopsis: "Arthur Morgan e a gangue de Van der Linde fogem enquanto agentes federais e caçadores de recompensas esmagam os últimos redutos do Velho Oeste." },
        "horizon": { year: "2022", synopsis: "Aloy viaja para terras distantes e perigosas para enfrentar máquinas titânicas e descobrir mistérios cruciais para a sobrevivência da humanidade." },
        "the order 1886": { year: "2015", synopsis: "Ambientado em uma Londres vitoriana alternativa, cavaleiros lendários combatem ameaças seculares com armas tecnológicas avançadas." },
        "marvel's avengers": { year: "2020", synopsis: "Reúne os heróis mais poderosos da Terra em uma aventura original misturando ação cinematográfica e modo cooperativo." },
        "star wars battlefront": { year: "2015", synopsis: "Viva fantasias de Star Wars em batalhas épicas multijogador nos locais mais icônicos da galáxia." },
        "cyberpunk 2077": { year: "2020", synopsis: "RPG de ação e mundo aberto ambientado na megalópole de Night City, obcecada por poder, glamour e modificações corporais cibernéticas." },
        "star wars battlefront ii": { year: "2017", synopsis: "Aventure-se na pele de uma elite de soldados imperiais em uma campanha rica em história e combates espaciais intensos." },
        "star wars jedi: fallen order": { year: "2019", synopsis: "Sobreviva à Ordem 66 na pele de um Padawan em fuga, reconstruindo seus poderes de Jedi e aprendendo os caminhos da Força." },
        "ratchet & clank": { year: "2016", synopsis: "Uma aventura espacial vibrante e repleta de armas surreais e plataformas dinâmicas pelo cosmos." },
        "death stranding": { year: "2019", synopsis: "De Hideo Kojima, uma jornada épica de reconexão para um mundo fragmentado ao longo de paisagens desoladas." },
        "titanfall 2": { year: "2016", synopsis: "A sinergia perfeita entre um piloto ágil e um robô gigante blindado em campanhas de tiro inovadoras." },
        "metal gear solid v": { year: "2015", synopsis: "Big Boss retorna em uma experiência stealth de mundo aberto incomparável que encerra a saga principal." },
        "fifa 18": { year: "2017", synopsis: "A emoção do futebol mundial com os modos de simulação realista e a continuação da jornada de Alex Hunter." },
        "spider-man": { year: "2018", synopsis: "Um Peter Parker experiente combate o crime organizado e supervilões icônicos enquanto equilibra sua caótica vida pessoal em Nova York." },
        "elden ring": { year: "2022", synopsis: "Explore o vasto Reino das Sombras e as Terras Intermédias criadas por Hidetaka Miyazaki e George R. R. Martin em uma odisseia Épica." },
        "uncharted": { year: "2016", synopsis: "Nathan Drake é forçado a retornar ao mundo dos ladrões em busca de tesouros históricos perdidos e segredos de piratas lendários." },
        "the last of us": { year: "2013", synopsis: "Em um mundo pós-apocalíptico assolado por uma pandemia fúngica, um contrabandista endurecido deve escoltar uma jovem resiliente." },

        "batman begins": { year: "2005", synopsis: "A origem sombria do Cavaleiro das Trevas nas ruas corrompidas de Gotham City." },
        "timesplitters": { year: "2005", synopsis: "Um clássico de tiro em primeira pessoa viajando por diferentes eras da história humana." },
        "final fantasy xii": { year: "2006", synopsis: "Intriga política e batalhas em tempo real no vasto e mágico mundo de Ivalice." },

        "senhor dos anéis": { year: "2003", synopsis: "O amaldiçoado Um Anel deve ser destruído na Montanha da Perdição para salvar a Terra-média das forças sombrias de Sauron." },
        "o cavaleiro das trevas ressurge": { year: "2012", synopsis: "O retorno de Bruce Wayne como Batman para enfrentar a força implacável de Bane." },
        "o cavaleiro das trevas": { year: "2008", synopsis: "Batman enfrenta o caos anárquico instaurado pelo imprevisível e brilhante Coringa." },
        "star wars: a saga completa": { year: "2011", synopsis: "A coleção definitiva reunindo os episódios clássicos, prelúdios e a jornada completa dos Skywalker." },
        "um novo dia para morrer": { year: "2002", synopsis: "James Bond investiga uma traição em alto nível ligando agentes duplos a armas de destruição em massa." },
        "o mundo não é o bastante": { year: "1999", synopsis: "007 protege a herdeira de um magnata do petróleo contra um terrorista que não sente dor física." },
        "o amanhã nunca morre": { year: "1997", synopsis: "James Bond tenta impedir que um magnata da mídia manipule eventos mundiais para iniciar uma guerra." },
        "goldeneye": { year: "1995", synopsis: "007 enfrenta um ex-colega dado como morto que controla uma arma de pulso eletromagnético orbital." },
        "a liga extraordinária": { year: "2003", synopsis: "Personagens lendários da literatura clássica unindo forças para salvar o mundo de uma grande ameaça." },
        "homem-aranha": { year: "2002", synopsis: "Peter Parker descobre seus poderes e assume sua responsabilidade combatendo o Duende Verde." },
        "homem-aranha 2": { year: "2004", synopsis: "Peter lida com a perda de poderes e o trágico Doutor Octopus em Nova York." },
        "homem-aranha 3": { year: "2007", synopsis: "O simbionte alienígena altera a personalidade de Peter e traz novos desafios internos e externos." },
        "transformers": { year: "2007", synopsis: "A guerra milenar entre Autobots e Decepticons chega à Terra através do cubo AllSpark." },
        "armageddon": { year: "1998", synopsis: "Uma equipe de perfuradores de petróleo é enviada ao espaço para destruir um asteroide colosso em rota de colisão." },
        "a outra face": { year: "1997", synopsis: "Um agente do FBI e um terrorista trocam de rostos cirurgicamente em um jogo mortal de gato e rato." },
        "piratas do caribe": { year: "2006", synopsis: "As aventuras marítimas repletas de maldições, tesouros perdidos e o carismático Capitão Jack Sparrow." },
        "os vingadores": { year: "2012", synopsis: "A união inédita dos maiores heróis da Terra sob o comando da S.H.I.E.L.D. contra invasores alienígenas." },
        "eragon": { year: "2006", synopsis: "Um jovem fazendeiro encontra um ovo de dragão e descobre seu destino como Cavaleiro protetor do reino." },
        "anjos e demônios": { year: "2009", synopsis: "Robert Langdon decifra códigos secretos no Vaticano para impedir um plano mortal contra a Igreja." },
        "o código da vinci": { year: "2006", synopsis: "Um assassinato no Louvre revela pistas enigmáticas ligadas a segredos seculares sobre o Graal." },
        "avatar": { year: "2009", synopsis: "Um fuzileiro naval paraplégico infiltra-se na lua Pandora através de um corpo híbrido conectado à natureza local." },
        "demolidor": { year: "2003", synopsis: "Matt Murdock usa seus sentidos hiperdesenvolvidos para combater o crime nas ruas de Nova York de forma implacável." },
        "poseidon": { year: "2006", synopsis: "Passageiros de um navio de cruzeiro lutam para sobreviver após uma onda gigante virar a embarcação." },
        "titanic": { year: "1997", synopsis: "Um romance épico e inesquecível a bordo do navio mais famoso do mundo durante sua viagem inaugural." }
    };

    function filterTab(category, btnElement) {
        currentTab = category;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (btnElement) btnElement.classList.add('active');
        renderCatalog();
    }

    function countCat(cat) {
        return catalog.filter(i => i.category === cat).length;
    }

    function updateCounters() {
        document.getElementById('count-ALL').textContent = catalog.length;
        document.getElementById('count-PS5').textContent = countCat('PS5');
        document.getElementById('count-PS4').textContent = countCat('PS4');
        document.getElementById('count-PS2').textContent = countCat('PS2');
        document.getElementById('count-Blu-ray').textContent = countCat('Blu-ray');
        document.getElementById('count-DVD').textContent = countCat('DVD');
    }

    function processImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function (e) {
                Quagga.decodeSingle({
                    src: e.target.result,
                    numOfWorkers: 0,
                    inputStream: { size: 800 },
                    decoder: { readers: ["ean_reader", "upc_reader", "code_128_reader"] },
                }, function(result) {
                    if (result && result.codeResult) {
                        promptItemDetails(result.codeResult.code);
                    } else {
                        const manualTitle = prompt("Código não lido. Digite o nome do Filme ou Jogo:");
                        if (manualTitle) saveNewItem('000000', manualTitle);
                    }
                    input.value = '';
                });
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function promptItemDetails(barcode) {
        const title = prompt(`Código detectado: ${barcode}\n\nDigite o nome do Filme ou Jogo:`, "");
        if (!title) return;
        saveNewItem(barcode, title);
    }

    function fetchSmartInfo(title, category) {
        const lowerTitle = title.toLowerCase().trim();
        
        for (let key in dbInfo) {
            if (lowerTitle.includes(key)) {
                return { year: dbInfo[key].year, synopsis: dbInfo[key].synopsis };
            }
        }

        let defaultYear = "2024";
        if(category === "PS2") defaultYear = "2006";
        if(category === "PS4") defaultYear = "2018";
        if(category === "PS5") defaultYear = "2023";
        if(category === "Blu-ray" || category === "DVD") defaultYear = "2015";

        return {
            year: defaultYear,
            synopsis: `Obra essencial catalogada sob a categoria ${category}. Acompanha a jornada imersiva de "${title}", destacando-se pela narrativa marcante e grande valor para colecionadores de mídias físicas.`
        };
    }

    function generateCoverUrl(title, category) {
        let coverUrl = `https://tse2.mm.bing.net/th?q=${encodeURIComponent(category)}+game+cover+${encodeURIComponent(title)}&w=500&h=750&c=7&rs=1&p=0`;
        if (category === "DVD" || category === "Blu-ray") {
            coverUrl = `https://tse2.mm.bing.net/th?q=movie+poster+${encodeURIComponent(title)}&w=500&h=750&c=7&rs=1&p=0`;
        }
        return coverUrl;
    }

    function saveNewItem(barcode, title, forcedCategory = null) {
        const category = forcedCategory || document.getElementById('categorySelect').value;
        const cleanTitle = title.trim();
        const coverUrl = generateCoverUrl(cleanTitle, category);
        const info = fetchSmartInfo(cleanTitle, category);

        const newItem = {
            id: Date.now() + Math.floor(Math.random() * 1000),
            category: category,
            barcode: barcode,
            title: cleanTitle,
            cover: coverUrl,
            year: info.year,
            synopsis: info.synopsis
        };

        catalog.push(newItem);
        localStorage.setItem('media_catalog', JSON.stringify(catalog));
        renderCatalog();
    }

    function updateItemDataAuto(id) {
        const item = catalog.find(i => i.id === id);
        if (!item) return;
        const info = fetchSmartInfo(item.title, item.category);
        item.year = info.year;
        item.synopsis = info.synopsis;
        localStorage.setItem('media_catalog', JSON.stringify(catalog));
        openDetails(id);
        renderCatalog();
        alert("Informações atualizadas com sucesso!");
    }

    function updateItemCoverAuto(id) {
        const item = catalog.find(i => i.id === id);
        if (!item) return;
        const base = generateCoverUrl(item.title, item.category);
        item.cover = base + "&t=" + Date.now();
        localStorage.setItem('media_catalog', JSON.stringify(catalog));
        openDetails(id);
        renderCatalog();
        alert("Capa atualizada com sucesso!");
    }

    function updateAllItemsSmart() {
        if (!confirm("Deseja atualizar automaticamente o ano e a sinopse de todos os itens cadastrados na estante?")) return;
        catalog.forEach(item => {
            const info = fetchSmartInfo(item.title, item.category);
            item.year = info.year;
            item.synopsis = info.synopsis;
        });
        localStorage.setItem('media_catalog', JSON.stringify(catalog));
        renderCatalog();
        alert("Todos os itens foram atualizados com sucesso!");
    }

    function openDetails(id) {
        const item = catalog.find(i => i.id === id);
        if (!item) return;
        const body = document.getElementById('modalBodyContent');
        body.innerHTML = `
            <div class="modal-img-wrapper">
                <img src="${item.cover}" class="modal-img" onerror="this.src='https://via.placeholder.com/300x400?text=Capa'">
                <button class="btn btn-sync" style="font-size: 0.75rem; padding: 6px;" onclick="changeCoverManual(${item.id})">🖼️ Link Personalizado</button>
            </div>
            <div class="modal-info">
                <span class="badge badge-${item.category}">${item.category}</span>
                <h2>${item.title}</h2>
                <div class="item-year" style="margin-bottom: 10px;">📅 Ano: ${item.year || 'N/D'}</div>
                <p style="font-size: 0.9rem; color: var(--text-muted); line-height: 1.4;"><strong>Sinopse:</strong><br>${item.synopsis || 'Sem sinopse cadastrada.'}</p>
                <div style="margin-top: 15px; font-family: monospace; font-size: 0.75rem; color: var(--text-muted);">Cód: ${item.barcode}</div>
                <div style="margin-top: 15px; display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="btn btn-primary" style="font-size: 0.75rem; padding: 6px 12px;" onclick="updateItemDataAuto(${item.id})">🔄 Atualizar Info</button>
                    <button class="btn btn-sync" style="font-size: 0.75rem; padding: 6px 12px; background-color: #0284c7;" onclick="updateItemCoverAuto(${item.id})">🔄 Atualizar Capa</button>
                    <button class="btn btn-edit" style="font-size: 0.75rem; padding: 6px 12px;" onclick="editItem(${item.id}, event); closeModalDirect();">✏️ Editar Manual</button>
                </div>
            </div>
        `;
        document.getElementById('itemModal').style.display = 'flex';
    }

    function changeCoverManual(id) {
        const item = catalog.find(i => i.id === id);
        if (!item) return;
        const newUrl = prompt("Cole o link direto da imagem da capa (URL):", item.cover);
        if (newUrl) {
            item.cover = newUrl.trim();
            localStorage.setItem('media_catalog', JSON.stringify(catalog));
            openDetails(id);
            renderCatalog();
        }
    }

    function closeModal(e) { if (e.target.id === 'itemModal') document.getElementById('itemModal').style.display = 'none'; }
    function closeModalDirect() { document.getElementById('itemModal').style.display = 'none'; }

    function openBatchModal() { document.getElementById('batchModal').style.display = 'flex'; }
    function closeBatchModal(e) { if (!e || e.target.id === 'batchModal') document.getElementById('batchModal').style.display = 'none'; }

    function processBatchImport() {
        const text = document.getElementById('batchTextarea').value;
        const lines = text.split('\n').filter(l => l.trim().length > 0);
        if (lines.length === 0) return alert("Insira ao menos um título.");

        const defaultCategory = document.getElementById('categorySelect').value;
        document.getElementById('batchModal').style.display = 'none';
        
        lines.forEach(line => {
            let cat = defaultCategory;
            let title = line.trim();
            if (line.includes('|')) {
                const parts = line.split('|');
                let rawCat = parts[0].trim().toUpperCase();
                title = parts[1].trim();
                if (rawCat.includes('PS5')) cat = 'PS5';
                else if (rawCat.includes('PS4')) cat = 'PS4';
                else if (rawCat.includes('PS2')) cat = 'PS2';
                else if (rawCat.includes('BLU')) cat = 'Blu-ray';
                else if (rawCat.includes('DVD')) cat = 'DVD';
            }
            saveNewItem('LOTE-' + Math.floor(Math.random()*10000), title, cat);
        });
        alert("Itens importados com sucesso!");
    }

    function editItem(id, event) {
        if(event) event.stopPropagation();
        const item = catalog.find(i => i.id === id);
        if (!item) return;
        const newTitle = prompt("Editar Nome:", item.title);
        if (newTitle !== null) item.title = newTitle;
        const newYear = prompt("Editar Ano:", item.year || "2024");
        if (newYear !== null) item.year = newYear;
        const newSynopsis = prompt("Editar Sinopse:", item.synopsis || "");
        if (newSynopsis !== null) item.synopsis = newSynopsis;
        const newCover = prompt("Editar Link da Capa:", item.cover);
        if (newCover !== null) item.cover = newCover;
        localStorage.setItem('media_catalog', JSON.stringify(catalog));
        renderCatalog();
    }

    function deleteItem(id, event) {
        event.stopPropagation();
        if (confirm("Remover este item?")) {
            catalog = catalog.filter(i => i.id !== id);
            localStorage.setItem('media_catalog', JSON.stringify(catalog));
            renderCatalog();
        }
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(catalog));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "minha_estante_backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importData(input) {
        const fileReader = new FileReader();
        if (input.files && input.files[0]) {
            fileReader.readAsText(input.files[0], "UTF-8");
            fileReader.onload = function (e) {
                try {
                    const importedCatalog = JSON.parse(e.target.result);
                    if (Array.isArray(importedCatalog)) {
                        catalog = importedCatalog;
                        localStorage.setItem('media_catalog', JSON.stringify(catalog));
                        renderCatalog();
                        alert("Backup importado com sucesso!");
                    }
                } catch (error) { alert("Erro ao ler o JSON."); }
            };
        }
    }

    function renderCatalog() {
        updateCounters();
        const grid = document.getElementById('catalogGrid');
        grid.innerHTML = '';

        const filtered = catalog.filter(item => {
            return (currentTab === 'ALL' || item.category === currentTab);
        });

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-state">Nenhum item encontrado na estante.</div>`;
            return;
        }

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = () => openDetails(item.id);
            card.innerHTML = `
                <div>
                    <span class="badge badge-${item.category}">${item.category}</span>
                    <div class="image-container ratio-${item.category}">
                        <img src="${item.cover}" alt="${item.title}" class="item-cover-img" onerror="this.src='https://via.placeholder.com/300x400?text=Capa'">
                    </div>
                    <div class="item-info">
                        <h3>${item.title}</h3>
                        <div class="item-year">📅 ${item.year || 'N/D'}</div>
                        <div class="barcode-text">Cód: ${item.barcode}</div>
                    </div>
                </div>
                <div class="card-actions">
                    <button class="btn-edit" onclick="editItem(${item.id}, event)">Editar</button>
                    <button class="btn-delete" onclick="deleteItem(${item.id}, event)">Excluir</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    renderCatalog();
</script>

        </div>

<script>
    function openApoioModal() {
        document.getElementById('apoioModal').style.display = 'flex';
        const input = document.getElementById('pixInputKey');
        input.select();
    }
    function closeApoioModal(e) {
        if (e.target.id === 'apoioModal') document.getElementById('apoioModal').style.display = 'none';
    }
    function closeApoioModalDirect() {
        document.getElementById('apoioModal').style.display = 'none';
    }
    function copyPixKey() {
        const input = document.getElementById('pixInputKey');
        input.select();
        input.setSelectionRange(0, 99999);
        try {
            const successful = document.execCommand('copy');
            if (successful) {
                alert("✅ Chave Pix copiada com sucesso! Muito obrigado pelo apoio! 🚀");
                closeApoioModalDirect();
            } else {
                navigator.clipboard.writeText(input.value).then(() => {
                    alert("✅ Chave Pix copiada com sucesso!");
                    closeApoioModalDirect();
                }).catch(() => {
                    alert("Por favor, copie manualmente a chave exibida no campo.");
                });
            }
        } catch (err) {
            alert("Por favor, copie manualmente a chave exibida no campo.");
        }
    }
</script>
